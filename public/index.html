<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramjet Proxy Prototype</title>
    <!-- Load the Scramjet client bundle -->
    <script src="/scram/scramjet.all.js"></script>
</head>
<body>

    <div style="text-align: center; margin-top: 50px;">
        <h2>Web Proxy Client</h2>
        <input type="text" id="url-input" placeholder="Enter URL (e.g., https://example.com)" style="width: 300px; padding: 10px;">
        <button onclick="launchProxy()" style="padding: 10px 20px;">Go</button>
    </div>

    <hr>

    <!-- The sandboxed container where the rewritten website will render -->
    <iframe id="proxy-view" style="width: 100%; height: 80vh; border: none; display: none;"></iframe>

    <script>
        // Ensure the Service Worker is registered when the page loads
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', {
                scope: '/service/' // The path prefix where intercepted requests live
            }).then(() => {
                console.log('Proxy Service Worker registered successfully.');
            }).catch(err => {
                console.error('Service Worker registration failed:', err);
            });
        }

        function launchProxy() {
            const input = document.getElementById('url-input').value;
            if (!input) return;

            // Format or resolve basic search strings into valid URLs
            let targetUrl = input.trim();
            if (!/^https?:\/\//i.test(targetUrl)) {
                targetUrl = 'https://' + targetUrl;
            }

            // Scramjet uses a specific encoder prefix to map target destinations safely
            const encodedUrl = __scramjet$config.prefix + __scramjet$config.encodeUrl(targetUrl);
            
            // Load the processed path into the iframe
            const iframe = document.getElementById('proxy-view');
            iframe.src = encodedUrl;
            iframe.style.display = "block";
        }
    </script>
</body>
</html>
